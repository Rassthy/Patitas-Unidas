services:

  nginx:
    image: nginx:alpine
    container_name: patitas_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - patitas_net
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: patitas_php
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - patitas_net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: patitas_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - patitas_net
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  patitas_net:
    driver: bridge
